<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>木柵聖母宮公告管理後台 v0.1</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 1rem;
      background-color: #f6f6f6;
    }
    h1 {
      text-align: center;
      margin-bottom: 1rem;
      font-size: 2rem;
    }
    .section {
      background: #fff;
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 0 5px rgba(0,0,0,0.1);
      margin-bottom: 1.5rem;
    }
    .field {
      margin-bottom: 0.8rem;
    }
    .field label {
      display: block;
      margin-bottom: 0.3rem;
      font-weight: bold;
    }
    input[type="text"], input[type="url"], textarea {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 1rem;
    }
    button {
      padding: 0.6rem 1rem;
      background: #0066cc;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 0.5rem;
      font-size: 1rem;
    }
    button.secondary {
      background: #777;
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    .status-box {
      margin-top: 0.8rem;
      padding: 0.75rem;
      border-radius: 4px;
      background: #f0f0f0;
      color: #333;
      font-size: 0.95rem;
      white-space: pre-wrap;
    }
    .status-ok {
      background: #e8f7e8;
      color: #166534;
    }
    .status-error {
      background: #fde8e8;
      color: #991b1b;
    }
    .announcement-card {
      background: #fff;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      box-shadow: 0 0 4px rgba(0,0,0,0.1);
    }
    .announcement-card h3 {
      margin-top: 0;
    }
    .actions {
      margin-top: 0.5rem;
    }
    .actions button {
      margin-bottom: 0.3rem;
    }
    .edit-form {
      margin-top: 0.8rem;
      padding-top: 0.8rem;
      border-top: 1px solid #eee;
    }
    .logout {
      text-align: right;
      margin-bottom: 1rem;
    }
    @media (max-width: 600px) {
      h1 {
        font-size: 1.7rem;
      }
      .actions button {
        width: 100%;
        margin-right: 0;
      }
    }
  </style>
</head>
<body>
  <h1>木柵聖母宮公告管理後台 v0.1</h1>

  <div class="section" id="config-section">
    <h2>Supabase 設定</h2>

    <div class="field">
      <label for="supabase-url">Supabase URL</label>
      <input type="url" id="supabase-url" placeholder="https://your-project.supabase.co">
    </div>

    <div class="field">
      <label for="supabase-key">Supabase Publishable Key</label>
      <input type="text" id="supabase-key" placeholder="sb_publishable_...">
    </div>

    <button id="init-supabase" type="button">初始化連線</button>

    <div id="connection-status" class="status-box">
      尚未初始化連線。
    </div>
  </div>

  <div class="section" id="login-section" style="display:none;">
    <h2>管理員登入</h2>
    <p>管理員信箱：<strong>mj29379898@gmail.com</strong></p>
    <button id="send-link" type="button">發送 Magic Link</button>
    <p id="login-message" class="status-box"></p>
  </div>

  <div class="section" id="admin-section" style="display:none;">
    <div class="logout">
      <button id="logout-btn" type="button">登出</button>
    </div>

    <h2>新增公告</h2>

    <div class="field">
      <label for="new-title">標題</label>
      <input type="text" id="new-title">
    </div>

    <div class="field">
      <label for="new-content">內容</label>
      <textarea id="new-content" rows="4"></textarea>
    </div>

    <button id="add-announcement" type="button">新增公告</button>

    <h2 style="margin-top:1.5rem;">公告列表</h2>
    <div id="announcements-list"></div>
  </div>

  <script>
    let supabaseClient = null;
    const adminEmail = 'mj29379898@gmail.com';

    function setConnectionStatus(message, type) {
      const el = document.getElementById('connection-status');
      el.textContent = message;
      el.className = 'status-box';

      if (type === 'ok') {
        el.classList.add('status-ok');
      }

      if (type === 'error') {
        el.classList.add('status-error');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      setConnectionStatus('頁面已載入。請確認 Supabase URL 與 Supabase Publishable Key 後，按「初始化連線」。', 'ok');

      const savedUrl = localStorage.getItem('supabase-url');
      const savedKey = localStorage.getItem('supabase-key');

      if (savedUrl) document.getElementById('supabase-url').value = savedUrl;
      if (savedKey) document.getElementById('supabase-key').value = savedKey;

      if (savedUrl && savedKey) {
        initSupabase(savedUrl, savedKey);
      }
    });

    document.getElementById('init-supabase').addEventListener('click', () => {
      const url = document.getElementById('supabase-url').value.trim();
      const key = document.getElementById('supabase-key').value.trim();

      setConnectionStatus('正在初始化 Supabase 連線...', 'ok');

      if (!url || !key) {
        setConnectionStatus('錯誤：請輸入 Supabase URL 和 Supabase Publishable Key。', 'error');
        alert('請輸入 Supabase URL 和 Supabase Publishable Key');
        return;
      }

      if (!url.startsWith('https://') || !url.includes('.supabase.co')) {
        setConnectionStatus('錯誤：Supabase URL 格式不正確，應類似 https://xxxx.supabase.co', 'error');
        return;
      }

      if (!key.startsWith('sb_publishable_')) {
        setConnectionStatus('錯誤：Supabase Publishable Key 格式不正確，應以 sb_publishable_ 開頭。', 'error');
        return;
      }

      localStorage.setItem('supabase-url', url);
      localStorage.setItem('supabase-key', key);

      initSupabase(url, key);
    });

    function initSupabase(url, key) {
      try {
        if (!window.supabase || !window.supabase.createClient) {
          setConnectionStatus('錯誤：Supabase JS SDK 尚未載入。請重新整理頁面，或檢查網路是否阻擋 cdn.jsdelivr.net。', 'error');
          return;
        }

        supabaseClient = window.supabase.createClient(url, key);

        setConnectionStatus('Supabase 連線初始化完成，正在檢查登入狀態...', 'ok');

        document.getElementById('config-section').style.display = 'block';
        document.getElementById('login-section').style.display = 'block';

        supabaseClient.auth.onAuthStateChange((event, session) => {
          if (session) {
            verifyAdmin(session);
          }
        });

        checkLoginStatus();
      } catch (err) {
        setConnectionStatus('初始化失敗：' + err.message, 'error');
      }
    }

    document.getElementById('send-link').addEventListener('click', async () => {
      if (!supabaseClient) {
        alert('請先完成 Supabase 初始化連線');
        return;
      }

      const redirectUrl = window.location.href.split('#')[0];

      const { error } = await supabaseClient.auth.signInWithOtp({
        email: adminEmail,
        options: {
          emailRedirectTo: redirectUrl
        }
      });

      if (error) {
        document.getElementById('login-message').textContent = '發送登入連結失敗：' + error.message;
        document.getElementById('login-message').className = 'status-box status-error';
        alert('發送登入連結失敗：' + error.message);
      } else {
        document.getElementById('login-message').textContent = '登入連結已寄出，請至信箱查收並點擊連結完成登入。';
        document.getElementById('login-message').className = 'status-box status-ok';
      }
    });

    document.getElementById('logout-btn').addEventListener('click', async () => {
      if (supabaseClient) {
        await supabaseClient.auth.signOut();
        document.getElementById('admin-section').style.display = 'none';
        document.getElementById('login-section').style.display = 'block';
      }
    });

    async function checkLoginStatus() {
      if (!supabaseClient) return;

      const { data, error } = await supabaseClient.auth.getSession();

      if (error) {
        setConnectionStatus('登入狀態檢查失敗：' + error.message, 'error');
        return;
      }

      if (data.session) {
        verifyAdmin(data.session);
      } else {
        setConnectionStatus('Supabase 連線成功。目前尚未登入，請按「發送 Magic Link」。', 'ok');
      }
    }

    function verifyAdmin(session) {
      if (session.user && session.user.email === adminEmail) {
        showAdminSection();
      } else {
        alert('您沒有權限存取此後台。');
        supabaseClient.auth.signOut();
      }
    }

    function showAdminSection() {
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('admin-section').style.display = 'block';
      loadAnnouncements();
    }

    async function loadAnnouncements() {
      const listDiv = document.getElementById('announcements-list');
      listDiv.innerHTML = '載入中...';

      const { data, error } = await supabaseClient
        .from('announcements')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        listDiv.innerHTML = '載入公告失敗：' + error.message;
        return;
      }

      if (!data || data.length === 0) {
        listDiv.innerHTML = '<p>尚未有公告。</p>';
        return;
      }

      listDiv.innerHTML = '';

      data.forEach(item => {
        const card = document.createElement('div');
        card.className = 'announcement-card';

        const titleEl = document.createElement('h3');
        titleEl.textContent = item.title;

        const contentEl = document.createElement('p');
        contentEl.textContent = item.content;

        const statusEl = document.createElement('p');
        statusEl.textContent =
          `狀態：${item.status === 'published' ? '已發布' : '草稿'}　${item.is_pinned ? '（置頂）' : ''}`;

        const datesEl = document.createElement('p');
        datesEl.style.fontSize = '0.8rem';
        datesEl.style.color = '#666';
        datesEl.textContent =
          `建立：${formatDate(item.created_at)}　更新：${formatDate(item.updated_at)}${item.published_at ? '　發布：' + formatDate(item.published_at) : ''}`;

        const actionsDiv = document.createElement('div');
        actionsDiv.className = 'actions';

        const editBtn = document.createElement('button');
        editBtn.type = 'button';
        editBtn.textContent = '編輯';
        editBtn.onclick = () => toggleEditMode(card, item);
        actionsDiv.appendChild(editBtn);

        const pubBtn = document.createElement('button');
        pubBtn.type = 'button';
        pubBtn.textContent = item.status === 'published' ? '下架' : '發布';
        pubBtn.onclick = () => togglePublish(item);
        actionsDiv.appendChild(pubBtn);

        const pinBtn = document.createElement('button');
        pinBtn.type = 'button';
        pinBtn.textContent = item.is_pinned ? '取消置頂' : '置頂';
        pinBtn.onclick = () => togglePin(item);
        actionsDiv.appendChild(pinBtn);

        card.appendChild(titleEl);
        card.appendChild(contentEl);
        card.appendChild(statusEl);
        card.appendChild(datesEl);
        card.appendChild(actionsDiv);

        listDiv.appendChild(card);
      });
    }

    document.getElementById('add-announcement').addEventListener('click', async () => {
      const title = document.getElementById('new-title').value.trim();
      const content = document.getElementById('new-content').value.trim();

      if (!title || !content) {
        alert('請輸入公告標題與內容');
        return;
      }

      const now = new Date().toISOString();

      const { error } = await supabaseClient
        .from('announcements')
        .insert([{
          title,
          content,
          status: 'draft',
          is_pinned: false,
          created_at: now,
          updated_at: now
        }]);

      if (error) {
        alert('新增公告失敗：' + error.message);
      } else {
        document.getElementById('new-title').value = '';
        document.getElementById('new-content').value = '';
        loadAnnouncements();
      }
    });

    async function togglePublish(item) {
      const isPublish = item.status !== 'published';
      const now = new Date().toISOString();

      const updates = isPublish
        ? { status: 'published', published_at: now, updated_at: now }
        : { status: 'draft', published_at: null, updated_at: now };

      const { error } = await supabaseClient
        .from('announcements')
        .update(updates)
        .eq('id', item.id);

      if (error) {
        alert('更新發布狀態失敗：' + error.message);
      } else {
        loadAnnouncements();
      }
    }

    async function togglePin(item) {
      const now = new Date().toISOString();

      const { error } = await supabaseClient
        .from('announcements')
        .update({
          is_pinned: !item.is_pinned,
          updated_at: now
        })
        .eq('id', item.id);

      if (error) {
        alert('更新置頂狀態失敗：' + error.message);
      } else {
        loadAnnouncements();
      }
    }

    function toggleEditMode(card, item) {
      const existing = card.querySelector('.edit-form');

      if (existing) {
        existing.remove();
        return;
      }

      const editDiv = document.createElement('div');
      editDiv.className = 'edit-form';

      const titleField = document.createElement('div');
      titleField.className = 'field';

      const titleLabel = document.createElement('label');
      titleLabel.textContent = '標題';

      const titleInput = document.createElement('input');
      titleInput.type = 'text';
      titleInput.value = item.title;

      titleField.appendChild(titleLabel);
      titleField.appendChild(titleInput);

      const contentField = document.createElement('div');
      contentField.className = 'field';

      const contentLabel = document.createElement('label');
      contentLabel.textContent = '內容';

      const contentTextarea = document.createElement('textarea');
      contentTextarea.rows = 4;
      contentTextarea.value = item.content;

      contentField.appendChild(contentLabel);
      contentField.appendChild(contentTextarea);

      const saveButton = document.createElement('button');
      saveButton.type = 'button';
      saveButton.textContent = '更新';
      saveButton.onclick = async () => {
        const newTitle = titleInput.value.trim();
        const newContent = contentTextarea.value.trim();

        if (!newTitle || !newContent) {
          alert('請輸入標題與內容');
          return;
        }

        const now = new Date().toISOString();

        const { error } = await supabaseClient
          .from('announcements')
          .update({
            title: newTitle,
            content: newContent,
            updated_at: now
          })
          .eq('id', item.id);

        if (error) {
          alert('編輯公告失敗：' + error.message);
        } else {
          editDiv.remove();
          loadAnnouncements();
        }
      };

      const cancelButton = document.createElement('button');
      cancelButton.type = 'button';
      cancelButton.textContent = '取消';
      cancelButton.className = 'secondary';
      cancelButton.onclick = () => {
        editDiv.remove();
      };

      editDiv.appendChild(titleField);
      editDiv.appendChild(contentField);
      editDiv.appendChild(saveButton);
      editDiv.appendChild(cancelButton);

      card.appendChild(editDiv);
    }

    function formatDate(dateString) {
      if (!dateString) return '';
      const d = new Date(dateString);
      return d.toLocaleString();
    }
  </script>
</body>
</html>
