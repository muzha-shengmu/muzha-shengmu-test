<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>木柵聖母宮｜本機版面檢查</title>
<style>body{margin:20px;font:16px/1.6 sans-serif;background:#eef1f4;color:#172b30}button,select{font:inherit;padding:8px;margin:4px}iframe{border:1px solid #809296;background:#0b1717}pre{white-space:pre-wrap;overflow-wrap:anywhere}label{margin-right:12px}</style>
<h1>木柵聖母宮｜本機版面檢查</h1><p>隔離候選；尺寸為視窗模擬，無真實手機硬體。所有網路後端與表單送出均被封鎖。</p>
<label>頁面<select id="page"></select></label><label>尺寸<select id="size"></select></label>
<label><input id="text" type="checkbox">文字放大 200%</label>
<button id="show">顯示頁面</button><button id="run">執行 15 頁版面檢查</button>
<p id="state" role="status">準備檢查</p><iframe id="preview" title="網站候選畫面"></iframe><pre id="report"></pre>
<script>
const pages=['index.html','about.html','mazu.html','history.html','announcements.html','announcement-admin.html','admin.html','pilgrimage.html','light.html','light-register.html','light-query.html','taisui.html','contact.html','home-about-top.html','404.html'];
const sizes=[[390,844],[430,932],[768,1024],[1024,768],[360,800],[1366,768],[1440,900]];
const by=id=>document.getElementById(id), frame=by('preview');
pages.forEach(p=>by('page').add(new Option(p,p)));sizes.forEach(s=>by('size').add(new Option(s.join(' × '),s.join(','))));
function show(page,size,text){return new Promise((resolve,reject)=>{frame.width=size[0];frame.height=size[1];const timer=setTimeout(()=>reject(Error('載入逾時：'+page)),10000);frame.onload=async()=>{try{const doc=frame.contentDocument;if(!doc?.documentElement)return;await doc.fonts.ready;await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));if(frame.contentDocument!==doc||!doc.documentElement)return;clearTimeout(timer);resolve();}catch(e){clearTimeout(timer);reject(e)}};frame.src='/'+page+(text?'?__qa_text=200':'');});}
function measure(page,size,text){const d=frame.contentDocument,w=frame.contentWindow;const visible=e=>{const r=e.getBoundingClientRect();return r.width>0&&r.height>0&&w.getComputedStyle(e).visibility!=='hidden'};const links=[...d.querySelectorAll('a[href]')];return {page,size,text200:text,title:d.title,overflow:d.documentElement.scrollWidth>w.innerWidth+1,brokenImages:[...d.images].filter(i=>!i.complete||i.naturalWidth===0).map(i=>i.getAttribute('src')),smallTargets:[...d.querySelectorAll('a,button,input,select,textarea')].filter(e=>visible(e)&&e.getBoundingClientRect().height<43.5).map(e=>(e.textContent||e.id).trim().slice(0,50)),missingAnchors:links.filter(a=>a.getAttribute('href').startsWith('#')&&a.hash.length>1&&!d.getElementById(a.hash.slice(1))).map(a=>a.hash),forms:[...d.forms].length,enabledInputs:[...d.querySelectorAll('form input,form textarea,form select')].filter(e=>visible(e)&&!e.disabled).length,fontsReady:d.fonts.status==='loaded'};}
by('show').onclick=async()=>{await show(by('page').value,by('size').value.split(',').map(Number),by('text').checked);by('state').textContent='頁面已載入';by('report').textContent=JSON.stringify(measure(by('page').value,by('size').value.split(',').map(Number),by('text').checked),null,2)};
by('run').onclick=async()=>{by('run').disabled=true;const results=[];try{for(const size of sizes){for(const page of pages){by('state').textContent='正在檢查 '+page+' '+size.join('×');await show(page,size,false);results.push(measure(page,size,false));}}for(const page of pages){await show(page,[390,844],true);results.push(measure(page,[390,844],true));}const problems=results.filter(r=>r.overflow||r.brokenImages.length||r.missingAnchors.length);by('report').textContent=JSON.stringify({kind:'iframe-viewport-simulation',runs:results.length,layoutFailures:problems.length,results},null,2);by('state').textContent='完成 '+results.length+' 次載入；版面問題 '+problems.length+' 項';}catch(e){by('state').textContent='檢查未完成：'+e.message;by('report').textContent=JSON.stringify({completed:results.length,last:results.at(-1),error:e.message},null,2);}finally{by('run').disabled=false;}};
show(pages[0],sizes[0],false);
</script></html>
